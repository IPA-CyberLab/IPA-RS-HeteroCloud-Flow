runtime:
  hostNetwork: true

# Forwarded workloads are eligible on every Kubernetes node. coturn has its own
# public-ingress selector because it is the only direct workload.
nodeSelector: {}

secrets:
  existingSecret: heterocloud-flow-secrets
  create: false

principalAuth:
  issuer: heterocloud
  audience: heterocloud-flow-data

# This deployment ceiling is shared by all replicas. Each authenticated Flow
# service applies its lower console-configured bucket in addition to this one.
# Forwarding metadata is trusted only from the three managed Caddy nodes.
rateLimit:
  requestsPerSecond: 1000
  burst: 5000
  trustedProxyCidrs:
    - 10.250.0.4/32
    - 10.250.0.5/32
    - 10.250.0.6/32
    - 163.220.236.51/32
    - 163.220.236.52/32
    - 163.220.236.53/32
    - 127.0.0.0/8
    - ::1/128

database:
  # Database clients run only where the node-local PostgreSQL HAProxy is ready.
  # Media and monitoring workloads remain eligible on every Kubernetes node.
  externalPort: 25432
  nodeSelector:
    database.heteronetwork.io/proxy-ready: "true"
  maxConnections:
    api: 6
    matchmaker: 3
    signaling: 4
  # API pods use their local 127.0.0.1:25432 proxy and sqlx migration lock.
  migrateOnApiStart: true
  migrationJob:
    enabled: false

api:
  replicaCount: 5
  publicUrls:
    - https://flow.heterocloud.mizuame.app
  # Per-node Caddy terminates TLS and health-checks all three forwarded ingress
  # addresses. Only those Caddy hosts may reach this plaintext service.
  publicService:
    enabled: true
    port: 8080
    annotations:
      networking.heteronetwork.io/ingress-replicas: "3"
    loadBalancerSourceRanges:
      - 163.220.236.51/32
      - 163.220.236.52/32
      - 163.220.236.53/32

matchmaker:
  replicaCount: 5

signaling:
  replicaCount: 5
  publicUrls:
    - wss://flow.heterocloud.mizuame.app
  publicService:
    enabled: true
    annotations:
      networking.heteronetwork.io/ingress-replicas: "3"
    loadBalancerSourceRanges:
      - 163.220.236.51/32
      - 163.220.236.52/32
      - 163.220.236.53/32

livekit:
  replicaCount: 5
  image:
    repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flow-livekit
    tag: "0.1.13"
  publicUrls:
    - wss://flow.heterocloud.mizuame.app
  signal:
    publicService:
      enabled: true
      annotations:
        networking.heteronetwork.io/ingress-replicas: "3"
      loadBalancerSourceRanges:
        - 163.220.236.51/32
        - 163.220.236.52/32
        - 163.220.236.53/32
  metrics:
    urls:
      - http://10.250.0.2:6789/metrics
      - http://10.250.0.3:6789/metrics
      - http://10.250.0.4:6789/metrics
      - http://10.250.0.5:6789/metrics
      - http://10.250.0.6:6789/metrics
  rtc:
    annotations:
      networking.heteronetwork.io/ingress-replicas: "3"
  resources:
    requests:
      cpu: "1"
      memory: 512Mi

coturn:
  replicaCount: 3
  realm: heterocloud-flow
  publicHosts:
    - flow.heterocloud.mizuame.app
  relayAddress:
    # These public addresses are local host interfaces, not NAT mappings.
    mode: direct-public
    mappings:
      - nodeName: uc-k8sp1
        publicIp: 163.220.236.51
        privateIp: 10.250.0.4
      - nodeName: uc-k8sp2
        publicIp: 163.220.236.52
        privateIp: 10.250.0.5
      - nodeName: uc-k8s3p
        publicIp: 163.220.236.53
        privateIp: 10.250.0.6
  metrics:
    urls:
      - http://10.250.0.4:9641/metrics
      - http://10.250.0.5:9641/metrics
      - http://10.250.0.6:9641/metrics
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  annotations:
    networking.heteronetwork.io/ingress-replicas: "3"
  nodeSelector:
    networking.heteronetwork.io/public-ingress: "true"

monitoring:
  prometheus:
    enabled: true
    replicaCount: 5
    service:
      type: LoadBalancer
      loadBalancerClass: heteronetwork.io/public
      ingressReplicas: 3
      loadBalancerSourceRanges:
        - 10.250.0.0/16
    vpnAccess:
      enabled: true
      sourceCidrs:
        - 10.250.0.0/16
    heteronetwork:
      enabled: true
      agentMetricsPort: 9781
      interface: heteronetwork0
    additionalScrapeNamespaces:
      - argocd
    storage:
      type: hostPath
      hostPath: /var/lib/heterocloud-flow/prometheus
    # Every node keeps a complete local TSDB. A failed node loses one copy
    # without interrupting queries or deleting the other four histories.
    nodeSelector: {}
    podDisruptionBudget:
      enabled: true
      minAvailable: 3
  grafana:
    enabled: true
    replicaCount: 5
    # Port 3000 is already occupied by an unrelated host service on one worker.
    # The LoadBalancer remains on 3000 and targets this private listener.
    listenPort: 33000
    anonymousViewerEnabled: true
    service:
      type: LoadBalancer
      loadBalancerClass: heteronetwork.io/public
      ingressReplicas: 3
      loadBalancerSourceRanges:
        - 10.250.0.0/16
    vpnAccess:
      enabled: true
      sourceCidrs:
        - 10.250.0.0/16
    nodeSelector: {}
    podDisruptionBudget:
      enabled: true
      minAvailable: 3

redis:
  enabled: true
  image:
    tag: ""
    digest: sha256:08863c2c3f4e051fb6139b38fa223e9c13be5033326a59bead182860d899bf98
  sentinel:
    quorum: 2
    image:
      tag: ""
      digest: sha256:ae75dd69c192a632bdeb21baa6721080be5b12347e52add922036398b47631da
  master:
    persistence:
      enabled: false
    pdb:
      create: true
      minAvailable: 1
  replica:
    # Redis/Sentinel is stateful control data, not a forwarded public workload.
    # Keep its quorum on the three always-on control-plane nodes.
    replicaCount: 3
    podAntiAffinityPreset: hard
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    persistence:
      enabled: false
    pdb:
      create: true
      minAvailable: 2

postgresql-ha:
  enabled: false
