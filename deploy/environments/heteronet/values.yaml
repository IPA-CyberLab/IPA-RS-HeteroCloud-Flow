runtime:
  hostNetwork: true

# Flow-owned workloads stay on the three public-IP control-plane nodes. Redis
# is a subchart and does not inherit this top-level selector.
nodeSelector:
  node-role.kubernetes.io/control-plane: ""

secrets:
  existingSecret: heterocloud-flow-secrets
  create: false

principalAuth:
  issuer: heterocloud
  audience: heterocloud-flow-data

# This deployment ceiling is shared by all replicas. Each authenticated Flow
# service applies its lower console-configured bucket in addition to this one.
# Forwarding metadata is trusted only from the three managed Caddy nodes.
rateLimit:
  requestsPerSecond: 1000
  burst: 5000
  trustedProxyCidrs:
    - 10.250.0.4/32
    - 10.250.0.5/32
    - 10.250.0.6/32
    - 127.0.0.0/8
    - ::1/128

database:
  # Every HeteroNet node exposes its local PostgreSQL HAProxy on loopback.
  externalPort: 25432
  maxConnections:
    api: 8
    matchmaker: 4
    signaling: 6
  # API pods use their local 127.0.0.1:25432 proxy and sqlx migration lock.
  migrateOnApiStart: true
  migrationJob:
    enabled: false

api:
  replicaCount: 3
  publicUrls:
    - https://flow.heterocloud.mizuame.app
  # Per-node Caddy terminates TLS and health-checks all three VPN upstreams.
  # Enable this separate plaintext L4 service only behind a trusted TLS tier
  # that also blocks /internal/*.
  publicService:
    enabled: false
    port: 8080
    annotations:
      networking.heteronetwork.io/traffic-mode: forwarded

matchmaker:
  replicaCount: 3

signaling:
  replicaCount: 3
  publicUrls:
    - wss://flow.heterocloud.mizuame.app
  publicService:
    enabled: false

livekit:
  replicaCount: 3
  image:
    repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flow-livekit
    tag: "0.1.12"
  publicUrls:
    - wss://flow.heterocloud.mizuame.app
  signal:
    publicService:
      enabled: false
  metrics:
    urls:
      - http://10.250.0.4:6789/metrics
      - http://10.250.0.5:6789/metrics
      - http://10.250.0.6:6789/metrics
  rtc:
    annotations:
      networking.heteronetwork.io/ingress-replicas: "3"
  resources:
    requests:
      cpu: "1"
      memory: 512Mi

coturn:
  replicaCount: 3
  realm: heterocloud-flow
  publicHosts:
    - flow.heterocloud.mizuame.app
  relayAddress:
    # These public addresses are local host interfaces, not NAT mappings.
    mode: direct-public
    mappings:
      - nodeName: uc-k8sp1
        publicIp: 163.220.236.51
        privateIp: 10.250.0.4
      - nodeName: uc-k8sp2
        publicIp: 163.220.236.52
        privateIp: 10.250.0.5
      - nodeName: uc-k8s3p
        publicIp: 163.220.236.53
        privateIp: 10.250.0.6
  metrics:
    urls:
      - http://10.250.0.4:9641/metrics
      - http://10.250.0.5:9641/metrics
      - http://10.250.0.6:9641/metrics
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  annotations:
    networking.heteronetwork.io/ingress-replicas: "3"

monitoring:
  prometheus:
    enabled: true
    replicaCount: 3
    service:
      type: LoadBalancer
      loadBalancerClass: heteronetwork.io/public
      trafficMode: forwarded
      ingressReplicas: 3
      loadBalancerSourceRanges:
        - 10.250.0.0/16
    vpnAccess:
      enabled: true
      sourceCidrs:
        - 10.250.0.0/16
    heteronetwork:
      enabled: true
      agentMetricsPort: 9781
      interface: heteronetwork0
    storage:
      type: hostPath
      hostPath: /var/lib/heterocloud-flow/prometheus
    # Every replica keeps a complete local TSDB on a separate control-plane
    # node. A failed node loses one copy without interrupting queries.
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    podDisruptionBudget:
      enabled: true
      minAvailable: 2

redis:
  enabled: true
  image:
    tag: ""
    digest: sha256:08863c2c3f4e051fb6139b38fa223e9c13be5033326a59bead182860d899bf98
  sentinel:
    image:
      tag: ""
      digest: sha256:ae75dd69c192a632bdeb21baa6721080be5b12347e52add922036398b47631da
  master:
    persistence:
      enabled: false
    pdb:
      create: true
      minAvailable: 1
  replica:
    # Sentinel mode uses this as the total node count: one primary and two
    # replicas after election.
    replicaCount: 3
    podAntiAffinityPreset: hard
    # Flow's Redis quorum is part of the control data plane. Keep it on the
    # three always-on control-plane nodes so transient edge/worker loss cannot
    # take LiveKit and signaling down with it.
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    persistence:
      enabled: false
    pdb:
      create: true
      minAvailable: 2

postgresql-ha:
  enabled: false
