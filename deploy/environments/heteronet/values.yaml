runtime:
  # Only coturn uses hostNetwork/direct mode. Control, signaling, SFU, and
  # matchmaker workloads stay on the Pod network and use forwarded Services.
  hostNetwork: false

image:
  tag: "f842649"

# Seven control-plane replicas must occupy at least three eligible hosts. A
# skew of three still allows overflow onto the two large machines, while
# DoNotSchedule prevents a 4+3 placement that one two-node fault can erase.
topologySpread:
  maxSkew: 3
  whenUnsatisfiable: DoNotSchedule

# Forwarded workloads are eligible on every Kubernetes node. coturn has its own
# public-ingress selector because it is the only direct workload.
nodeSelector: {}

secrets:
  existingSecret: heterocloud-flow-secrets
  create: false

principalAuth:
  issuer: heterocloud
  audience: heterocloud-flow-data

# This deployment ceiling is shared by all replicas. Each authenticated Flow
# service applies its lower console-configured bucket in addition to this one.
# Forwarding metadata is trusted only from the three managed Caddy nodes.
rateLimit:
  requestsPerSecond: 1000
  burst: 5000
  trustedProxyCidrs:
    - 10.250.0.4/32
    - 10.250.0.5/32
    - 10.250.0.6/32
    - 10.250.0.8/32
    - 10.250.0.10/32
    - 163.220.236.45/32
    - 163.220.236.51/32
    - 163.220.236.52/32
    - 163.220.236.53/32
    - 163.220.236.61/32
    - 127.0.0.0/8
    - ::1/128

database:
  # Database clients run only on endpointNodeNames. The chart turns this map
  # into required node affinity, so stale node labels cannot place a client on
  # a host without a node-local PostgreSQL HAProxy.
  externalPort: 25432
  # Pod-network workloads use the VPN-bound HAProxy listeners through a
  # selector-free Service. The Secret can continue to contain the legacy
  # 127.0.0.1:25432 URL; Flow rewrites only its host and port at startup.
  proxy:
    enabled: true
    port: 55432
    addresses:
      - 10.250.0.4
      - 10.250.0.5
      - 10.250.0.6
      - 10.250.0.8
      - 10.250.0.10
    endpointNodeNames:
      "10.250.0.4": uc-k8sp1
      "10.250.0.5": uc-k8sp2
      "10.250.0.6": uc-k8s3p
      "10.250.0.8": uc-k8sv1
      "10.250.0.10": ichikawap1
  nodeSelector: {}
  maxConnections:
    api: 8
    matchmaker: 4
    signaling: 8
  # API pods use their local 127.0.0.1:25432 proxy and sqlx migration lock.
  migrateOnApiStart: true
  migrationJob:
    enabled: false

api:
  # Seven replicas are balanced over the five node-local DB proxy hosts.
  replicaCount: 7
  publicUrls:
    - https://flow.heterocloud.mizuame.app
  # Per-node Caddy terminates TLS and health-checks all three forwarded ingress
  # addresses. Only those Caddy hosts may reach this plaintext service.
  publicService:
    # HTTP API is reachable only through the Envoy Gateway route. Keeping a
    # public Service here would leave a rate-limit bypass around the gateway.
    enabled: false
    port: 8080
    annotations:
      networking.heteronetwork.io/ingress-replicas: "3"
    loadBalancerSourceRanges:
      - 163.220.236.45/32
      - 163.220.236.52/32
      - 163.220.236.53/32

matchmaker:
  replicaCount: 7

signaling:
  replicaCount: 7
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 1Gi
  publicUrls:
    - wss://flow.heterocloud.mizuame.app
  publicService:
    # WebSocket signaling is reachable only through the Envoy Gateway route.
    enabled: false
    annotations:
      networking.heteronetwork.io/ingress-replicas: "3"
    loadBalancerSourceRanges:
      - 163.220.236.45/32
      - 163.220.236.52/32
      - 163.220.236.53/32

livekit:
  replicaCount: 7
  image:
    repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flow-livekit
    tag: "0.1.17"
  publicUrls:
    - wss://flow.heterocloud.mizuame.app
  signal:
    publicService:
      # LiveKit signaling shares the Envoy Gateway HTTP/WSS entry point.
      enabled: false
      annotations:
        networking.heteronetwork.io/ingress-replicas: "3"
      loadBalancerSourceRanges:
        - 163.220.236.45/32
        - 163.220.236.52/32
        - 163.220.236.53/32
  metrics:
    urls:
      - http://10.250.0.2:6789/metrics
      - http://10.250.0.3:6789/metrics
      - http://10.250.0.5:6789/metrics
      - http://10.250.0.6:6789/metrics
      - http://10.250.0.10:6789/metrics
      - http://10.250.0.8:6789/metrics
  rtc:
    annotations:
      networking.heteronetwork.io/ingress-replicas: "3"
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: "4"
      memory: 4Gi

coturn:
  replicaCount: 4
  relayPortMin: 49152
  relayPortMax: 57343
  additionalPools:
    - name: secondary
      replicaCount: 4
      servicePort: 3479
      relayPortMin: 57344
      relayPortMax: 65535
      metricsPort: 9642
  realm: heterocloud-flow
  publicHosts:
    - flow.heterocloud.mizuame.app
  relayAddress:
    # Keep TURN on the same public nodes that terminate flow HTTPS. This makes
    # every address in the unified flow DNS RRset valid for HTTP, WSS and TURN.
    # These addresses are assigned directly to the selected hosts. Bind relay
    # sockets to them so media does not make an avoidable VPN round trip.
    mode: direct-public
    mappings:
      - nodeName: uc-k8sp1
        publicIp: 163.220.236.51
        privateIp: 10.250.0.4
      - nodeName: uc-k8sp2
        publicIp: 163.220.236.52
        privateIp: 10.250.0.5
      - nodeName: uc-k8s3p
        publicIp: 163.220.236.53
        privateIp: 10.250.0.6
      - nodeName: ichikawap1
        publicIp: 163.220.236.61
        privateIp: 10.250.0.10
  metrics:
    urls:
      - http://10.250.0.4:9641/metrics
      - http://10.250.0.5:9641/metrics
      - http://10.250.0.6:9641/metrics
      - http://10.250.0.10:9641/metrics
      - http://10.250.0.4:9642/metrics
      - http://10.250.0.5:9642/metrics
      - http://10.250.0.6:9642/metrics
      - http://10.250.0.10:9642/metrics
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  annotations:
    networking.heteronetwork.io/ingress-replicas: "4"
  nodeSelector:
    networking.heteronetwork.io/public-ingress: "true"

monitoring:
  prometheus:
    enabled: true
    replicaCount: 3
    service:
      type: LoadBalancer
      loadBalancerClass: heteronetwork.io/public
      ingressReplicas: 3
      loadBalancerSourceRanges:
        - 10.250.0.0/16
    vpnAccess:
      enabled: true
      sourceCidrs:
        - 10.250.0.0/16
    heteronetwork:
      enabled: true
      agentMetricsPort: 9781
      interface: heteronetwork0
    additionalScrapeNamespaces:
      - argocd
      - envoy-gateway-system
    retentionTime: 7d
    retentionSize: 4GB
    storage:
      type: hostPath
      hostPath: /var/lib/heterocloud-flow/prometheus
    # Keep constant TSDB writes away from the two low-IOPS etcd members.
    # Three independent copies still leave one query endpoint after two faults.
    nodeSelector: {}
    allowedNodes:
      - ichikawap1
      - uc-k8s3p
      - uc-k8sv1
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  grafana:
    enabled: true
    replicaCount: 3
    # Port 3000 is already occupied by an unrelated host service on one worker.
    # The LoadBalancer remains on 3000 and targets this private listener.
    listenPort: 13000
    anonymousViewerEnabled: true
    service:
      type: LoadBalancer
      loadBalancerClass: heteronetwork.io/public
      ingressReplicas: 3
      loadBalancerSourceRanges:
        - 10.250.0.0/16
    vpnAccess:
      enabled: true
      sourceCidrs:
        - 10.250.0.0/16
    nodeSelector: {}
    allowedNodes:
      - ichikawap1
      - uc-k8s3p
      - uc-k8sv1
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

redis:
  enabled: true
  image:
    tag: ""
    digest: sha256:08863c2c3f4e051fb6139b38fa223e9c13be5033326a59bead182860d899bf98
  sentinel:
    quorum: 3
    downAfterMilliseconds: 2000
    failoverTimeout: 10000
    parallelSyncs: 2
    automateClusterRecovery: true
    image:
      tag: ""
      digest: sha256:ae75dd69c192a632bdeb21baa6721080be5b12347e52add922036398b47631da
  master:
    persistence:
      enabled: false
    pdb:
      create: true
      minAvailable: 1
  replica:
    # Redis/Sentinel is stateful control data, not a forwarded public workload.
    # Five control-plane placements retain a three-voter quorum after any two
    # node failures.
    replicaCount: 5
    podAntiAffinityPreset: hard
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    persistence:
      enabled: false
    pdb:
      create: true
      minAvailable: 3

postgresql-ha:
  enabled: false
