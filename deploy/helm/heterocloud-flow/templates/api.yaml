{{- include "flow.rejectTrafficModeAnnotation" (dict "annotations" .Values.api.publicService.annotations "path" "api.publicService.annotations") -}}
{{- $databaseNodeSelector := mergeOverwrite (deepCopy (.Values.nodeSelector | default dict)) (.Values.database.nodeSelector | default dict) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow.fullname" . }}-api
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "flow.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.runtime.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        {{- include "flow.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "flow.topologySpread" (dict "root" . "component" "api") | nindent 8 }}
      affinity:
        {{- include "flow.requiredPodAntiAffinity" (dict "root" . "component" "api") | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "flow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/flow-api"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.runtime.hostNetwork }}
            - name: FLOW_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: FLOW_API_BIND_ADDR
              value: "$(FLOW_HOST_IP):8080"
            {{- else }}
            - name: FLOW_API_BIND_ADDR
              value: "0.0.0.0:8080"
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: database-url
            {{- include "flow.databaseProxyEnv" . | nindent 12 }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.database.maxConnections.api | quote }}
            - name: MIGRATE_ON_START
              value: {{ .Values.database.migrateOnApiStart | quote }}
            - name: HETEROCLOUD_PROVIDER_ISSUER
              value: {{ .Values.providerAuth.issuer | quote }}
            - name: HETEROCLOUD_PROVIDER_AUDIENCE
              value: {{ .Values.providerAuth.audience | quote }}
            - name: HETEROCLOUD_PROVIDER_PUBLIC_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: {{ .Values.providerAuth.publicKeysSecretKey }}
            - name: FLOW_PRINCIPAL_ISSUER
              value: {{ .Values.principalAuth.issuer | quote }}
            - name: FLOW_PRINCIPAL_AUDIENCE
              value: {{ .Values.principalAuth.audience | quote }}
            - name: FLOW_PRINCIPAL_MAX_TTL_SECONDS
              value: {{ .Values.principalAuth.maxTokenTtlSeconds | quote }}
            - name: FLOW_PRINCIPAL_CONTEXT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: {{ .Values.principalAuth.contextSecretKey }}
            - name: FLOW_PUBLIC_RATE_LIMIT_RPS
              value: {{ .Values.rateLimit.requestsPerSecond | quote }}
            - name: FLOW_PUBLIC_RATE_LIMIT_BURST
              value: {{ .Values.rateLimit.burst | quote }}
            - name: FLOW_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.rateLimit.trustedProxyCidrs | quote }}
            {{- if or .Values.redis.enabled .Values.externalRedis.sentinelUrls }}
            - name: REDIS_SENTINEL_URLS
              value: {{ include "flow.redisSentinelUrls" . | quote }}
            - name: REDIS_SENTINEL_MASTER
              value: {{ include "flow.redisSentinelMaster" . | quote }}
            {{- else }}
            - name: REDIS_URL
              value: {{ required "externalRedis.address is required" .Values.externalRedis.address | quote }}
            {{- end }}
            {{- if and (not .Values.redis.enabled) .Values.externalRedis.passwordSecretKey }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: {{ .Values.externalRedis.passwordSecretKey }}
            {{- end }}
            {{- if and (not .Values.redis.enabled) .Values.externalRedis.sentinelPasswordSecretKey }}
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: {{ .Values.externalRedis.sentinelPasswordSecretKey }}
            {{- end }}
            - name: LIVEKIT_URL
              value: {{ .Values.livekit.internalUrl | quote }}
            - name: FLOW_API_URLS
              value: {{ join "," .Values.api.publicUrls | quote }}
            - name: LIVEKIT_WS_URLS
              value: {{ join "," .Values.livekit.publicUrls | quote }}
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: livekit-api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: livekit-api-secret
            - name: LIVEKIT_TOKEN_TTL_SECONDS
              value: {{ .Values.principalAuth.maxTokenTtlSeconds | quote }}
            - name: FLOW_SIGNALING_URLS
              value: {{ join "," .Values.signaling.publicUrls | quote }}
            - name: TURN_URLS
              value: {{ include "flow.turnUrls" . | quote }}
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: turn-shared-secret
            - name: TURN_CREDENTIAL_TTL_SECONDS
              value: {{ .Values.coturn.credentialTtlSeconds | quote }}
            - name: COTURN_METRICS_URLS
              value: {{ join "," .Values.coturn.metrics.urls | quote }}
            - name: LIVEKIT_METRICS_URLS
              value: {{ join "," .Values.livekit.metrics.urls | quote }}
            - name: RUST_LOG
              value: info
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            {{- include "flow.rustSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with $databaseNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flow.fullname" . }}-api
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "flow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      appProtocol: http
{{- if .Values.api.publicService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flow.fullname" . }}-api-public
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    networking.heteronetwork.io/traffic-mode: "forwarded"
    {{- with .Values.api.publicService.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  loadBalancerClass: heteronetwork.io/public
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  {{- with .Values.api.publicService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "flow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.publicService.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
{{- end }}
