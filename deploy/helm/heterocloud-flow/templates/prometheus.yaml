{{- if .Values.monitoring.prometheus.enabled }}
{{- $prometheus := .Values.monitoring.prometheus -}}
{{- $replicaCount := int $prometheus.replicaCount -}}
{{- $serviceType := $prometheus.service.type -}}
{{- if lt $replicaCount 1 -}}
{{- fail "monitoring.prometheus.replicaCount must be at least 1" -}}
{{- end -}}
{{- if and $prometheus.vpnAccess.enabled (empty $prometheus.vpnAccess.sourceCidrs) -}}
{{- fail "monitoring.prometheus.vpnAccess.sourceCidrs must contain at least one VPN CIDR when VPN access is enabled" -}}
{{- end -}}
{{- if not (has $serviceType (list "ClusterIP" "LoadBalancer")) -}}
{{- fail "monitoring.prometheus.service.type must be ClusterIP or LoadBalancer" -}}
{{- end -}}
{{- if eq $serviceType "LoadBalancer" -}}
{{- if empty $prometheus.service.loadBalancerClass -}}
{{- fail "monitoring.prometheus.service.loadBalancerClass is required for LoadBalancer" -}}
{{- end -}}
{{- if or (lt (int $prometheus.service.ingressReplicas) 1) (gt (int $prometheus.service.ingressReplicas) 64) -}}
{{- fail "monitoring.prometheus.service.ingressReplicas must be between 1 and 64" -}}
{{- end -}}
{{- if empty $prometheus.service.loadBalancerSourceRanges -}}
{{- fail "monitoring.prometheus.service.loadBalancerSourceRanges must restrict LoadBalancer access" -}}
{{- end -}}
{{- else if not (empty $prometheus.service.loadBalancerClass) -}}
{{- fail "monitoring.prometheus.service LoadBalancer settings require type LoadBalancer" -}}
{{- end -}}
{{- if and $prometheus.podDisruptionBudget.enabled (gt (int $prometheus.podDisruptionBudget.minAvailable) $replicaCount) -}}
{{- fail "monitoring.prometheus.podDisruptionBudget.minAvailable must not exceed replicaCount" -}}
{{- end -}}
{{- $prometheusName := printf "%s-prometheus" (include "flow.fullname" .) -}}
{{- $clusterRoleName := printf "%s-%s" $prometheusName .Release.Namespace | trunc 63 | trimSuffix "-" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $prometheusName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - pods
      - endpoints
      - services
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $prometheusName }}
    namespace: {{ .Release.Namespace }}
---
{{ include "flow.prometheus.configmap" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $prometheusName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: {{ $replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/resource-exporter: {{ toString .Values.monitoring.resourceExporter.enabled | sha256sum }}
        checksum/config: {{ include "flow.prometheus.configmap" . | sha256sum }}
    spec:
      {{- if $prometheus.vpnAccess.enabled }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      serviceAccountName: {{ $prometheusName }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if eq $prometheus.storage.type "hostPath" }}
      initContainers:
        - name: prepare-storage
          image: {{ include "flow.imageRef" $prometheus.initImage }}
          imagePullPolicy: {{ $prometheus.initImage.pullPolicy }}
          command: [/bin/sh, -ec, "chown -R 65532:65532 /prometheus"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /prometheus
      {{- end }}
      containers:
        - name: prometheus
          image: {{ include "flow.imageRef" $prometheus.image }}
          imagePullPolicy: {{ $prometheus.image.pullPolicy }}
          {{- if $prometheus.vpnAccess.enabled }}
          env:
            - name: PROMETHEUS_LISTEN_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          {{- end }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $prometheus.retentionTime }}
            - --storage.tsdb.retention.size={{ $prometheus.retentionSize }}
            - --storage.tsdb.wal-compression
            {{- if $prometheus.vpnAccess.enabled }}
            - --web.listen-address=$(PROMETHEUS_LISTEN_ADDRESS):{{ $prometheus.service.port }}
            {{- else }}
            - --web.listen-address=0.0.0.0:{{ $prometheus.service.port }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $prometheus.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml $prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          configMap:
            name: {{ $prometheusName }}
            defaultMode: 0444
        - name: data
          {{- if eq $prometheus.storage.type "hostPath" }}
          hostPath:
            path: {{ required "monitoring.prometheus.storage.hostPath is required for hostPath storage" $prometheus.storage.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir:
            sizeLimit: {{ $prometheus.storage.emptyDir.sizeLimit }}
          {{- end }}
      {{- if or (gt $replicaCount 1) $prometheus.allowedNodes }}
      affinity:
        {{- if gt $replicaCount 1 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "flow.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: prometheus
        {{- end }}
        {{- with $prometheus.allowedNodes }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      {{- toYaml . | nindent 22 }}
        {{- end }}
      {{- end }}
      {{- with $prometheus.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $prometheus.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if $prometheus.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $prometheusName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  minAvailable: {{ $prometheus.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $prometheusName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  {{- if eq $serviceType "LoadBalancer" }}
  annotations:
    networking.heteronetwork.io/traffic-mode: "forwarded"
    networking.heteronetwork.io/ingress-replicas: {{ $prometheus.service.ingressReplicas | quote }}
  {{- end }}
spec:
  type: {{ $serviceType }}
  {{- if eq $serviceType "LoadBalancer" }}
  loadBalancerClass: {{ $prometheus.service.loadBalancerClass | quote }}
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  {{- with $prometheus.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "flow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: {{ $prometheus.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
{{- end }}
