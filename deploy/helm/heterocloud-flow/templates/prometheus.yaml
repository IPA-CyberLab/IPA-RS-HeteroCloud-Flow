{{- if .Values.monitoring.prometheus.enabled }}
{{- $prometheus := .Values.monitoring.prometheus -}}
{{- $replicaCount := int $prometheus.replicaCount -}}
{{- $serviceType := $prometheus.service.type -}}
{{- if lt $replicaCount 1 -}}
{{- fail "monitoring.prometheus.replicaCount must be at least 1" -}}
{{- end -}}
{{- if and $prometheus.vpnAccess.enabled (empty $prometheus.vpnAccess.sourceCidrs) -}}
{{- fail "monitoring.prometheus.vpnAccess.sourceCidrs must contain at least one VPN CIDR when VPN access is enabled" -}}
{{- end -}}
{{- if not (has $serviceType (list "ClusterIP" "LoadBalancer")) -}}
{{- fail "monitoring.prometheus.service.type must be ClusterIP or LoadBalancer" -}}
{{- end -}}
{{- if eq $serviceType "LoadBalancer" -}}
{{- if empty $prometheus.service.loadBalancerClass -}}
{{- fail "monitoring.prometheus.service.loadBalancerClass is required for LoadBalancer" -}}
{{- end -}}
{{- if or (lt (int $prometheus.service.ingressReplicas) 1) (gt (int $prometheus.service.ingressReplicas) 64) -}}
{{- fail "monitoring.prometheus.service.ingressReplicas must be between 1 and 64" -}}
{{- end -}}
{{- if empty $prometheus.service.loadBalancerSourceRanges -}}
{{- fail "monitoring.prometheus.service.loadBalancerSourceRanges must restrict LoadBalancer access" -}}
{{- end -}}
{{- else if not (empty $prometheus.service.loadBalancerClass) -}}
{{- fail "monitoring.prometheus.service LoadBalancer settings require type LoadBalancer" -}}
{{- end -}}
{{- if and $prometheus.podDisruptionBudget.enabled (gt (int $prometheus.podDisruptionBudget.minAvailable) $replicaCount) -}}
{{- fail "monitoring.prometheus.podDisruptionBudget.minAvailable must not exceed replicaCount" -}}
{{- end -}}
{{- $prometheusName := printf "%s-prometheus" (include "flow.fullname" .) -}}
{{- $clusterRoleName := printf "%s-%s" $prometheusName .Release.Namespace | trunc 63 | trimSuffix "-" -}}
{{- $coturnReplicas := int .Values.coturn.replicaCount -}}
{{- $relayPorts := add1 (sub (int .Values.coturn.relayPortMax) (int .Values.coturn.relayPortMin)) -}}
{{- $relayCapacity := mul $relayPorts $coturnReplicas -}}
{{- range $pool := .Values.coturn.additionalPools -}}
{{- $poolRelayPorts := add1 (sub (int $pool.relayPortMax) (int $pool.relayPortMin)) -}}
{{- $coturnReplicas = add $coturnReplicas (int $pool.replicaCount) -}}
{{- $relayCapacity = add $relayCapacity (mul $poolRelayPorts (int $pool.replicaCount)) -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $prometheusName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - pods
      - endpoints
      - services
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $prometheusName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $prometheusName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ $prometheus.scrapeInterval }}
      evaluation_interval: {{ $prometheus.evaluationInterval }}
      external_labels:
        {{- toYaml $prometheus.externalLabels | nindent 8 }}
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: {{ .Release.Name | quote }}
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: prometheus
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      {{- if .Values.monitoring.grafana.enabled }}
      - job_name: grafana
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: {{ .Release.Name | quote }}
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: grafana
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      {{- end }}

      {{- if $prometheus.additionalScrapeNamespaces }}
      - job_name: kubernetes-services-annotated
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                {{- toYaml $prometheus.additionalScrapeNamespaces | nindent 16 }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: (http-)?metrics
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      {{- end }}

      - job_name: kubernetes-nodes-resource
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server_name: kubernetes.default.svc
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/resource

      - job_name: kubernetes-nodes-cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server_name: kubernetes.default.svc
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      {{- if $prometheus.heteronetwork.enabled }}
      - job_name: heteronetwork-agents
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: $1:{{ $prometheus.heteronetwork.agentMetricsPort }}
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: vpn_ip
      {{- end }}

      - job_name: flow-livekit
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: {{ .Release.Name | quote }}
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: livekit
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: flow-coturn
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: {{ .Release.Name | quote }}
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: coturn
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          # Per-credential series are unbounded and are not required for
          # aggregate relay capacity or transfer-rate monitoring.
          - source_labels: [__name__]
            action: drop
            regex: turn_traffic_.*
  rules.yml: |
    groups:
      - name: heterocloud-flow-capacity
        interval: {{ $prometheus.evaluationInterval }}
        rules:
          - record: flow:turn_allocations:sum
            expr: sum(turn_total_allocations{job="flow-coturn"})
          - record: flow:turn_allocation_utilization:ratio
            expr: flow:turn_allocations:sum / {{ $relayCapacity }}
          - record: flow:node_cpu_utilization:ratio
            expr: (rate(node_cpu_usage_seconds_total{job="kubernetes-nodes-resource"}[5m]) / on (node) machine_cpu_cores{job="kubernetes-nodes-cadvisor"}) or on (node) sum by (node) (0 * up{job="heteronetwork-agents"})
          - record: flow:node_memory_working_set:ratio
            expr: (node_memory_working_set_bytes{job="kubernetes-nodes-resource"} / on (node) machine_memory_bytes{job="kubernetes-nodes-cadvisor"}) or on (node) sum by (node) (0 * up{job="heteronetwork-agents"})
          - record: flow:node_network_receive_bytes_per_second
            expr: sum by (node, interface) (rate(container_network_receive_bytes_total{job="kubernetes-nodes-cadvisor",id="/"}[5m]))
          - record: flow:node_network_transmit_bytes_per_second
            expr: sum by (node, interface) (rate(container_network_transmit_bytes_total{job="kubernetes-nodes-cadvisor",id="/"}[5m]))
          {{- if $prometheus.heteronetwork.enabled }}
          - record: heteronetwork:node_vpn_receive_bytes_per_second
            expr: sum by (node) (rate(container_network_receive_bytes_total{job="kubernetes-nodes-cadvisor",id="/",interface={{ $prometheus.heteronetwork.interface | quote }}}[5m]))
          - record: heteronetwork:node_vpn_transmit_bytes_per_second
            expr: sum by (node) (rate(container_network_transmit_bytes_total{job="kubernetes-nodes-cadvisor",id="/",interface={{ $prometheus.heteronetwork.interface | quote }}}[5m]))
          - record: heteronetwork:active_peers:sum
            expr: sum(ipars_agent_active_peers{job="heteronetwork-agents"})
          - record: heteronetwork:pinned_peers:sum
            expr: sum(ipars_agent_pinned_peers{job="heteronetwork-agents"})
          - record: heteronetwork:relay_sessions:sum
            expr: sum(ipars_agent_relay_sessions{job="heteronetwork-agents"})
          {{- end }}
          - alert: FlowTurnAllocationCapacityHigh
            expr: flow:turn_allocation_utilization:ratio > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: TURN relay allocation capacity is above 80 percent
          - alert: FlowMetricsTargetMissing
            expr: count(up{job="flow-coturn"} == 1) < {{ $coturnReplicas }} or count(up{job="flow-livekit"} == 1) < {{ .Values.livekit.replicaCount }}
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: A Flow media metrics target is unavailable
          - alert: FlowNodeCpuHigh
            expr: flow:node_cpu_utilization:ratio > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Kubernetes node CPU utilization is above 85 percent
          - alert: FlowNodeMemoryHigh
            expr: flow:node_memory_working_set:ratio > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Kubernetes node memory working set is above 85 percent
          {{- if $prometheus.heteronetwork.enabled }}
          - alert: HeteroNetworkAgentMetricsMissing
            expr: absent(up{job="heteronetwork-agents"}) or min(up{job="heteronetwork-agents"}) < 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: At least one HeteroNetwork Agent metrics endpoint is unavailable
          {{- end }}
          - alert: PrometheusReplicaMissing
            expr: count(up{job="prometheus"} == 1) < {{ $replicaCount }}
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Fewer than {{ $replicaCount }} Prometheus replicas are available
          {{- if .Values.monitoring.grafana.enabled }}
          - alert: GrafanaReplicaMissing
            expr: count(up{job="grafana"} == 1) < {{ .Values.monitoring.grafana.replicaCount }}
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Fewer than {{ .Values.monitoring.grafana.replicaCount }} Grafana replicas are available
          {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $prometheusName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: {{ $replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/config: {{ printf "%s-%s" (toJson $prometheus) .Chart.Version | sha256sum }}
    spec:
      {{- if $prometheus.vpnAccess.enabled }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      serviceAccountName: {{ $prometheusName }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if eq $prometheus.storage.type "hostPath" }}
      initContainers:
        - name: prepare-storage
          image: {{ include "flow.imageRef" $prometheus.initImage }}
          imagePullPolicy: {{ $prometheus.initImage.pullPolicy }}
          command: [/bin/sh, -ec, "chown -R 65532:65532 /prometheus"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /prometheus
      {{- end }}
      containers:
        - name: prometheus
          image: {{ include "flow.imageRef" $prometheus.image }}
          imagePullPolicy: {{ $prometheus.image.pullPolicy }}
          {{- if $prometheus.vpnAccess.enabled }}
          env:
            - name: PROMETHEUS_LISTEN_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          {{- end }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $prometheus.retentionTime }}
            - --storage.tsdb.retention.size={{ $prometheus.retentionSize }}
            - --storage.tsdb.wal-compression
            {{- if $prometheus.vpnAccess.enabled }}
            - --web.listen-address=$(PROMETHEUS_LISTEN_ADDRESS):{{ $prometheus.service.port }}
            {{- else }}
            - --web.listen-address=0.0.0.0:{{ $prometheus.service.port }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $prometheus.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml $prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          configMap:
            name: {{ $prometheusName }}
            defaultMode: 0444
        - name: data
          {{- if eq $prometheus.storage.type "hostPath" }}
          hostPath:
            path: {{ required "monitoring.prometheus.storage.hostPath is required for hostPath storage" $prometheus.storage.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir:
            sizeLimit: {{ $prometheus.storage.emptyDir.sizeLimit }}
          {{- end }}
      {{- if gt $replicaCount 1 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "flow.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: prometheus
      {{- end }}
      {{- with $prometheus.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $prometheus.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if $prometheus.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $prometheusName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  minAvailable: {{ $prometheus.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $prometheusName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  {{- if eq $serviceType "LoadBalancer" }}
  annotations:
    networking.heteronetwork.io/traffic-mode: "forwarded"
    networking.heteronetwork.io/ingress-replicas: {{ $prometheus.service.ingressReplicas | quote }}
  {{- end }}
spec:
  type: {{ $serviceType }}
  {{- if eq $serviceType "LoadBalancer" }}
  loadBalancerClass: {{ $prometheus.service.loadBalancerClass | quote }}
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  {{- with $prometheus.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "flow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: {{ $prometheus.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
{{- end }}
