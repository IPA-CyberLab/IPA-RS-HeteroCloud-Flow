{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flow.secretName" . }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.values.databaseUrl is required" .Values.secrets.values.databaseUrl | quote }}
  heterocloud-provider-public-keys.json: {{ required "secrets.values.heterocloudProviderPublicKeysJson is required" .Values.secrets.values.heterocloudProviderPublicKeysJson | quote }}
  flow-principal-context-hmac-secret: {{ required "secrets.values.flowPrincipalContextHmacSecret is required" .Values.secrets.values.flowPrincipalContextHmacSecret | quote }}
  livekit-api-key: {{ required "secrets.values.livekitApiKey is required" .Values.secrets.values.livekitApiKey | quote }}
  livekit-api-secret: {{ required "secrets.values.livekitApiSecret is required" .Values.secrets.values.livekitApiSecret | quote }}
  turn-shared-secret: {{ required "secrets.values.turnSharedSecret is required" .Values.secrets.values.turnSharedSecret | quote }}
  livekit-keys.yaml: |
    {{ required "secrets.values.livekitApiKey is required" .Values.secrets.values.livekitApiKey | quote }}: {{ required "secrets.values.livekitApiSecret is required" .Values.secrets.values.livekitApiSecret | quote }}
{{- end }}
