{{- if .Values.monitoring.grafana.enabled }}
{{- $grafana := .Values.monitoring.grafana -}}
{{- $databaseNodeSelector := mergeOverwrite (deepCopy ($grafana.nodeSelector | default dict)) (.Values.database.nodeSelector | default dict) -}}
{{- $replicaCount := int $grafana.replicaCount -}}
{{- $serviceType := $grafana.service.type -}}
{{- if not .Values.monitoring.prometheus.enabled -}}
{{- fail "monitoring.prometheus.enabled must be true when Grafana is enabled" -}}
{{- end -}}
{{- if lt $replicaCount 1 -}}
{{- fail "monitoring.grafana.replicaCount must be at least 1" -}}
{{- end -}}
{{- if empty $grafana.existingSecret -}}
{{- fail "monitoring.grafana.existingSecret is required" -}}
{{- end -}}
{{- if and $grafana.vpnAccess.enabled (empty $grafana.vpnAccess.sourceCidrs) -}}
{{- fail "monitoring.grafana.vpnAccess.sourceCidrs must contain at least one VPN CIDR when VPN access is enabled" -}}
{{- end -}}
{{- if not (has $serviceType (list "ClusterIP" "LoadBalancer")) -}}
{{- fail "monitoring.grafana.service.type must be ClusterIP or LoadBalancer" -}}
{{- end -}}
{{- if eq $serviceType "LoadBalancer" -}}
{{- if empty $grafana.service.loadBalancerClass -}}
{{- fail "monitoring.grafana.service.loadBalancerClass is required for LoadBalancer" -}}
{{- end -}}
{{- if or (lt (int $grafana.service.ingressReplicas) 1) (gt (int $grafana.service.ingressReplicas) 64) -}}
{{- fail "monitoring.grafana.service.ingressReplicas must be between 1 and 64" -}}
{{- end -}}
{{- if empty $grafana.service.loadBalancerSourceRanges -}}
{{- fail "monitoring.grafana.service.loadBalancerSourceRanges must restrict LoadBalancer access" -}}
{{- end -}}
{{- else if not (empty $grafana.service.loadBalancerClass) -}}
{{- fail "monitoring.grafana.service LoadBalancer settings require type LoadBalancer" -}}
{{- end -}}
{{- if and $grafana.podDisruptionBudget.enabled (gt (int $grafana.podDisruptionBudget.minAvailable) $replicaCount) -}}
{{- fail "monitoring.grafana.podDisruptionBudget.minAvailable must not exceed replicaCount" -}}
{{- end -}}
{{- $grafanaName := printf "%s-grafana" (include "flow.fullname" .) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $grafanaName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: {{ $grafana.prometheusUrl | quote }}
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          prometheusType: Prometheus
          prometheusVersion: 3.13.2
          timeInterval: {{ .Values.monitoring.prometheus.scrapeInterval | quote }}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: HeteroCloud
        orgId: 1
        folder: HeteroCloud
        folderUid: heterocloud
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
  heterocloud-flow.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "grafana", "uid": "-- Grafana --"},
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 5}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "sum(up{job=\"heteronetwork-agents\"})", "instant": true, "legendFormat": "VPN agents", "range": false, "refId": "A"}],
          "title": "VPN agents up",
