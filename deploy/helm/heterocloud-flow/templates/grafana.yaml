apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $grafanaName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: {{ $replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/config: {{ printf "%s-%s" (toJson $grafana) .Chart.Version | sha256sum }}
    spec:
      {{- if $grafana.vpnAccess.enabled }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ include "flow.imageRef" $grafana.image }}
          imagePullPolicy: {{ $grafana.image.pullPolicy }}
          env:
            {{- if $grafana.vpnAccess.enabled }}
            - name: GF_SERVER_HTTP_ADDR
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- else }}
            - name: GF_SERVER_HTTP_ADDR
              value: 0.0.0.0
            {{- end }}
            - name: GF_SERVER_HTTP_PORT
              value: {{ $grafana.listenPort | quote }}
            - name: GF_SERVER_ENABLE_GZIP
              value: "true"
            - name: GF_DATABASE_TYPE
              value: postgres
            - name: GF_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $grafana.existingSecret }}
                  key: {{ $grafana.secretKeys.databaseUrl }}
            - name: GF_DATABASE_MAX_OPEN_CONN
              value: "10"
            - name: GF_DATABASE_MAX_IDLE_CONN
              value: "3"
            - name: GF_DATABASE_CONN_MAX_LIFETIME
              value: "14400"
            - name: GF_DATABASE_LOCKING_ATTEMPT_TIMEOUT_SEC
              value: "300"
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $grafana.existingSecret }}
                  key: {{ $grafana.secretKeys.adminUser }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $grafana.existingSecret }}
                  key: {{ $grafana.secretKeys.adminPassword }}
            - name: GF_SECURITY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $grafana.existingSecret }}
                  key: {{ $grafana.secretKeys.secretKey }}
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: strict
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ $grafana.anonymousViewerEnabled | quote }}
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_ANONYMOUS_HIDE_VERSION
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_USERS_ALLOW_ORG_CREATE
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_SNAPSHOTS_EXTERNAL_ENABLED
              value: "false"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/heterocloud-flow.json
            - name: GF_DATE_FORMATS_DEFAULT_TIMEZONE
              value: browser
          ports:
            - name: http
              containerPort: {{ $grafana.listenPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml $grafana.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: logs
              mountPath: /var/log/grafana
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: provisioning
          configMap:
            name: {{ $grafanaName }}
            defaultMode: 0444
            items:
              - key: datasource.yaml
                path: datasources/managed.yaml
              - key: dashboards.yaml
                path: dashboards/managed.yaml
        - name: dashboards
          configMap:
            name: {{ $grafanaName }}
            defaultMode: 0444
            items:
              - key: heterocloud-flow.json
                path: heterocloud-flow.json
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- if gt $replicaCount 1 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "flow.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: grafana
      {{- end }}
      {{- with $databaseNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if $grafana.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $grafanaName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  minAvailable: {{ $grafana.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $grafanaName }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- if eq $serviceType "LoadBalancer" }}
  annotations:
    networking.heteronetwork.io/traffic-mode: "forwarded"
    networking.heteronetwork.io/ingress-replicas: {{ $grafana.service.ingressReplicas | quote }}
  {{- end }}
spec:
  type: {{ $serviceType }}
  {{- if eq $serviceType "LoadBalancer" }}
  loadBalancerClass: {{ $grafana.service.loadBalancerClass | quote }}
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  {{- with $grafana.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "flow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: {{ $grafana.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
{{- end }}
