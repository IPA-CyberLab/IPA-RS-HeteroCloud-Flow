      ],
      "refresh": "15s",
      "schemaVersion": 41,
      "tags": ["heterocloud", "flow", "heteronetwork", "vpn"],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": {"text": "All", "value": "$__all"},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "definition": "label_values(up{job=\"heteronetwork-agents\"}, node)",
