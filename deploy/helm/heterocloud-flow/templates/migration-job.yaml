{{- if .Values.database.migrationJob.enabled }}
{{- $databaseNodeSelector := mergeOverwrite (deepCopy (.Values.nodeSelector | default dict)) (.Values.database.nodeSelector | default dict) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flow.fullname" . }}-migrate
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "flow.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.runtime.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        {{- include "flow.podSecurityContext" . | nindent 8 }}
      {{- if and .Values.database.proxy.enabled (gt (len .Values.database.proxy.endpointNodeNames) 0) }}
      affinity:
        {{- include "flow.databaseNodeAffinity" . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "flow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/flow-api", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: database-url
            - name: DATABASE_MAX_CONNECTIONS
              value: "2"
            - name: MIGRATE_ON_START
              value: "true"
            - name: HETEROCLOUD_PROVIDER_ISSUER
              value: {{ .Values.providerAuth.issuer | quote }}
            - name: HETEROCLOUD_PROVIDER_AUDIENCE
              value: {{ .Values.providerAuth.audience | quote }}
            - name: HETEROCLOUD_PROVIDER_PUBLIC_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: {{ .Values.providerAuth.publicKeysSecretKey }}
            - name: FLOW_PRINCIPAL_ISSUER
              value: {{ .Values.principalAuth.issuer | quote }}
            - name: FLOW_PRINCIPAL_AUDIENCE
              value: {{ .Values.principalAuth.audience | quote }}
            - name: FLOW_PRINCIPAL_CONTEXT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: {{ .Values.principalAuth.contextSecretKey }}
            - name: LIVEKIT_URL
              value: {{ .Values.livekit.internalUrl | quote }}
            - name: LIVEKIT_WS_URLS
              value: {{ join "," .Values.livekit.publicUrls | quote }}
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: livekit-api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: livekit-api-secret
            - name: FLOW_SIGNALING_URLS
              value: {{ join "," .Values.signaling.publicUrls | quote }}
            - name: TURN_URLS
              value: {{ include "flow.turnUrls" . | quote }}
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: turn-shared-secret
          securityContext:
            {{- include "flow.rustSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      {{- with $databaseNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
