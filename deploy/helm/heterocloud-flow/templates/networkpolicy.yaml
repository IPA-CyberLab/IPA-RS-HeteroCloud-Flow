{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flow.fullname" . }}-default-deny
  labels:
    {{- include "flow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flow.fullname" . }}-control-plane
  labels:
    {{- include "flow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, matchmaker, signaling, migration]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - port: 8080
          protocol: TCP
        - port: 8082
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector: {}
      ports:
        - port: {{ $.Values.database.externalPort }}
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
        - port: 7880
          protocol: TCP
        - port: {{ $.Values.livekit.metrics.port }}
          protocol: TCP
        - port: {{ $.Values.coturn.metrics.port }}
          protocol: TCP
    {{- if $.Values.database.proxy.enabled }}
    {{- range $.Values.database.proxy.addresses }}
    - to:
        - ipBlock:
            cidr: {{ . }}/32
      ports:
        - port: {{ $.Values.database.proxy.port }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.externalEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - port: {{ $.Values.database.externalPort }}
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
        - port: {{ $.Values.livekit.metrics.port }}
          protocol: TCP
        - port: {{ $.Values.coturn.metrics.port }}
          protocol: TCP
    {{- end }}
---
# hostNetwork enforcement depends on the cluster CNI. These rules still apply
# on CNIs that support host-network policy and document the intended boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flow.fullname" . }}-media-plane
  labels:
    {{- include "flow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [livekit, coturn]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
  egress:
    - {}
{{- if .Values.monitoring.prometheus.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flow.fullname" . }}-prometheus
  labels:
    {{- include "flow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        {{- if .Values.monitoring.prometheus.vpnAccess.enabled }}
        {{- range .Values.monitoring.prometheus.vpnAccess.sourceCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- end }}
      ports:
        - port: {{ .Values.monitoring.prometheus.service.port }}
          protocol: TCP
  # Prometheus needs the Kubernetes API service plus host-network metrics on
  # every managed node. Scrape targets remain constrained by its configuration
  # and read-only RBAC permissions.
  egress:
    - {}
{{- end }}
{{- if .Values.monitoring.grafana.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flow.fullname" . }}-grafana
  labels:
    {{- include "flow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        {{- if .Values.monitoring.grafana.vpnAccess.enabled }}
        {{- range .Values.monitoring.grafana.vpnAccess.sourceCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- end }}
      ports:
        - port: {{ .Values.monitoring.grafana.listenPort }}
          protocol: TCP
  # Grafana reaches the in-cluster Prometheus Service and the host-network
  # PostgreSQL HA proxy. Destination access is constrained by those services.
  egress:
    - {}
{{- end }}
{{- end }}
