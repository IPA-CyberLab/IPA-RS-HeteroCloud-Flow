{{- include "flow.rejectTrafficModeAnnotation" (dict "annotations" .Values.coturn.annotations "path" "coturn.annotations") -}}
{{- $relayAddressMode := .Values.coturn.relayAddress.mode -}}
{{- $relayAddressMappings := .Values.coturn.relayAddress.mappings -}}
{{- $coturnNodeSelector := mergeOverwrite (deepCopy (.Values.nodeSelector | default dict)) (.Values.coturn.nodeSelector | default dict) -}}
{{- $relayAddressMappingArgs := list -}}
{{- $mappingNodeNames := dict -}}
{{- $mappingPublicIps := dict -}}
{{- $mappingPrivateIps := dict -}}
{{- if not (or (eq $relayAddressMode "host") (eq $relayAddressMode "direct-public") (eq $relayAddressMode "one-to-one-nat")) -}}
{{- fail (printf "unsupported coturn.relayAddress.mode %q" $relayAddressMode) -}}
{{- end -}}
{{- range $mapping := $relayAddressMappings -}}
{{- if hasKey $mappingNodeNames $mapping.nodeName -}}
{{- fail (printf "coturn.relayAddress.mappings contains duplicate nodeName %q" $mapping.nodeName) -}}
{{- end -}}
{{- if hasKey $mappingPublicIps $mapping.publicIp -}}
{{- fail (printf "coturn.relayAddress.mappings contains duplicate publicIp %q" $mapping.publicIp) -}}
{{- end -}}
{{- if hasKey $mappingPrivateIps $mapping.privateIp -}}
{{- fail (printf "coturn.relayAddress.mappings contains duplicate privateIp %q" $mapping.privateIp) -}}
{{- end -}}
{{- $_ := set $mappingNodeNames $mapping.nodeName true -}}
{{- $_ := set $mappingPublicIps $mapping.publicIp true -}}
{{- $_ := set $mappingPrivateIps $mapping.privateIp true -}}
{{- $relayAddressMappingArgs = append $relayAddressMappingArgs (printf "%s=%s/%s" $mapping.nodeName $mapping.publicIp $mapping.privateIp) -}}
{{- end -}}
{{- if and (eq $relayAddressMode "host") (gt (len $relayAddressMappings) 0) -}}
{{- fail "coturn.relayAddress.mappings must be empty when mode is host" -}}
{{- end -}}
{{- $coturnPools := list (dict
  "name" "primary"
  "suffix" ""
  "replicaCount" (int .Values.coturn.replicaCount)
  "servicePort" (int .Values.coturn.servicePort)
  "relayPortMin" (int .Values.coturn.relayPortMin)
  "relayPortMax" (int .Values.coturn.relayPortMax)
  "metricsPort" (int .Values.coturn.metrics.port)
) -}}
{{- range $additionalPool := .Values.coturn.additionalPools -}}
{{- $coturnPools = append $coturnPools (dict
  "name" $additionalPool.name
  "suffix" (printf "-%s" $additionalPool.name)
  "replicaCount" (int $additionalPool.replicaCount)
  "servicePort" (int $additionalPool.servicePort)
  "relayPortMin" (int $additionalPool.relayPortMin)
  "relayPortMax" (int $additionalPool.relayPortMax)
  "metricsPort" (int $additionalPool.metricsPort)
) -}}
{{- end -}}
{{- $poolNames := dict -}}
{{- $servicePorts := dict -}}
{{- $metricsPorts := dict -}}
{{- $relayRanges := list -}}
{{- range $pool := $coturnPools -}}
{{- if hasKey $poolNames $pool.name -}}
{{- fail (printf "coturn pool name %q is duplicated" $pool.name) -}}
{{- end -}}
{{- $_ := set $poolNames $pool.name true -}}
{{- if gt $pool.replicaCount 16 -}}
{{- fail (printf "coturn pool %q replicaCount must not exceed 16" $pool.name) -}}
{{- end -}}
{{- if and (ne $relayAddressMode "host") (lt (len $relayAddressMappings) $pool.replicaCount) -}}
{{- fail (printf "coturn.relayAddress.mappings must contain at least %d entries for pool %q" $pool.replicaCount $pool.name) -}}
{{- end -}}
{{- $servicePortKey := toString $pool.servicePort -}}
{{- if hasKey $servicePorts $servicePortKey -}}
{{- fail (printf "coturn service port %d is used by more than one pool" $pool.servicePort) -}}
{{- end -}}
{{- $_ := set $servicePorts $servicePortKey true -}}
{{- $metricsPortKey := toString $pool.metricsPort -}}
{{- if hasKey $metricsPorts $metricsPortKey -}}
{{- fail (printf "coturn metrics port %d is used by more than one pool" $pool.metricsPort) -}}
{{- end -}}
{{- $_ := set $metricsPorts $metricsPortKey true -}}
{{- if gt $pool.relayPortMin $pool.relayPortMax -}}
{{- fail (printf "coturn pool %q relayPortMin must not exceed relayPortMax" $pool.name) -}}
{{- end -}}
{{- range $existingRange := $relayRanges -}}
{{- if and (le $pool.relayPortMin $existingRange.max) (le $existingRange.min $pool.relayPortMax) -}}
{{- fail (printf "coturn relay port ranges for pools %q and %q overlap" $existingRange.name $pool.name) -}}
{{- end -}}
{{- end -}}
{{- $relayRanges = append $relayRanges (dict "name" $pool.name "min" $pool.relayPortMin "max" $pool.relayPortMax) -}}
{{- end -}}
{{- range $pool := $coturnPools }}
{{- if ne $pool.suffix "" }}
---
{{- end }}
{{- with $ }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow.fullname" . }}-coturn{{ $pool.suffix }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
    flow.heterocloud.io/turn-pool: {{ $pool.name }}
spec:
  replicas: {{ $pool.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coturn
      {{- if ne $pool.suffix "" }}
      flow.heterocloud.io/turn-pool: {{ $pool.name }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: coturn
        flow.heterocloud.io/turn-pool: {{ $pool.name }}
        networking.heteronetwork.io/traffic-mode: direct
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "flow.serviceAccountName" . }}
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "flow.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: coturn
              flow.heterocloud.io/turn-pool: {{ $pool.name }}
      affinity:
        {{- if $relayAddressMappings }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              {{- range $mapping := $relayAddressMappings }}
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values:
                      - {{ $mapping.nodeName | quote }}
              {{- end }}
        {{- end }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "flow.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: coturn
                  flow.heterocloud.io/turn-pool: {{ $pool.name }}
      terminationGracePeriodSeconds: 30
      {{- if .Values.coturn.performance.tuneHostUdpBuffers }}
      initContainers:
        - name: tune-host-udp-buffers
          image: "{{ .Values.coturn.performance.tuningImage.repository }}:{{ .Values.coturn.performance.tuningImage.tag }}"
          imagePullPolicy: {{ .Values.coturn.performance.tuningImage.pullPolicy }}
          command:
            - /bin/sysctl
            - -w
            - net.core.rmem_max={{ int .Values.coturn.performance.hostReceiveBufferMaxBytes }}
            - net.core.wmem_max={{ int .Values.coturn.performance.hostSendBufferMaxBytes }}
            - net.core.netdev_max_backlog={{ int .Values.coturn.performance.hostNetdevMaxBacklog }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
      {{- end }}
      containers:
        - name: coturn
          image: "{{ .Values.coturn.image.repository }}:{{ .Values.coturn.image.tag }}"
          imagePullPolicy: {{ .Values.coturn.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /var/lib/coturn/turndb /tmp/turndb
              chmod 0600 /tmp/turndb

              set -- turnserver \
                -n \
                --log-file=stdout \
                --pidfile= \
                --fingerprint \
                --use-auth-secret \
                "--static-auth-secret=${TURN_SHARED_SECRET}" \
                --userdb=/tmp/turndb \
                --realm={{ .Values.coturn.realm | quote }} \
                --listening-port={{ $pool.servicePort }} \
                --min-port={{ $pool.relayPortMin }} \
                --max-port={{ $pool.relayPortMax }} \
                --sock-buf-size={{ int .Values.coturn.performance.socketBufferBytes }} \
                --stale-nonce=600 \
                --no-tls \
                --no-dtls \
                --no-auth-pings \
                --no-dynamic-ip-list \
                --no-dynamic-realms \
                --no-multicast-peers \
                --prometheus \
                --prometheus-port={{ $pool.metricsPort }} \
                --prometheus-username-labels

              if [ "${TURN_RELAY_ADDRESS_MODE}" != host ]; then
                selected_node_name=
                selected_public_ip=
                selected_private_ip=
                old_ifs=${IFS}
                IFS=,
                set -f
                for mapping in ${TURN_RELAY_ADDRESS_MAPPINGS}; do
                  node_name=${mapping%%=*}
                  addresses=${mapping#*=}
                  public_ip=${addresses%%/*}
                  private_ip=${addresses#*/}
                  if [ "${NODE_NAME}" = "${node_name}" ] && [ "${HOST_IP}" = "${private_ip}" ]; then
                    selected_node_name=${node_name}
                    selected_public_ip=${public_ip}
                    selected_private_ip=${private_ip}
                  fi
                done
                set +f
                IFS=${old_ifs}

                if [ -z "${selected_public_ip}" ]; then
                  echo "coturn: node ${NODE_NAME} with host IP ${HOST_IP} has no matching coturn.relayAddress.mappings entry" >&2
                  exit 1
                fi

                case "${TURN_RELAY_ADDRESS_MODE}" in
                  direct-public)
                    relay_ip=${selected_public_ip}
                    set -- "$@" "--relay-ip=${selected_public_ip}"
                    ;;
                  one-to-one-nat)
                    relay_ip=${selected_private_ip}
                    set -- "$@" \
                      "--relay-ip=${selected_private_ip}" \
                      "--external-ip=${selected_public_ip}/${selected_private_ip}"
                    ;;
                  *)
                    echo "coturn: unsupported relay address mode ${TURN_RELAY_ADDRESS_MODE}" >&2
                    exit 1
                    ;;
                esac

                case " $(hostname -I) " in
                  *" ${relay_ip} "*) ;;
                  *)
                    echo "coturn: relay IP ${relay_ip} for node ${selected_node_name} is not assigned to a local interface" >&2
                    exit 1
                    ;;
                esac
              fi

              exec "$@"
          env:
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow.secretName" . }}
                  key: turn-shared-secret
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TURN_RELAY_ADDRESS_MODE
              value: {{ $relayAddressMode | quote }}
            - name: TURN_RELAY_ADDRESS_MAPPINGS
              value: {{ join "," $relayAddressMappingArgs | quote }}
          ports:
            - name: turn-tcp
              containerPort: {{ $pool.servicePort }}
              hostPort: {{ $pool.servicePort }}
              protocol: TCP
            - name: turn-udp
              containerPort: {{ $pool.servicePort }}
              hostPort: {{ $pool.servicePort }}
              protocol: UDP
            - name: metrics
              containerPort: {{ $pool.metricsPort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: turn-tcp
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: turn-tcp
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.coturn.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $coturnNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flow.fullname" . }}-turn{{ $pool.suffix }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
    flow.heterocloud.io/turn-pool: {{ $pool.name }}
    {{- if eq $pool.name "primary" }}
    dns.heterocloud.io/publish: "true"
    {{- end }}
  annotations:
    networking.heteronetwork.io/traffic-mode: "direct"
    {{- if eq $pool.name "primary" }}
    external-dns.alpha.kubernetes.io/hostname: {{ join "," .Values.coturn.publicHosts | quote }}
    external-dns.alpha.kubernetes.io/ttl: "60"
    {{- end }}
    {{- with .Values.coturn.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  loadBalancerClass: heteronetwork.io/public
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  selector:
    {{- include "flow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
    flow.heterocloud.io/turn-pool: {{ $pool.name }}
  ports:
    - name: turn-udp
      port: {{ $pool.servicePort }}
      targetPort: turn-udp
      protocol: UDP
    - name: turn-tcp
      port: {{ $pool.servicePort }}
      targetPort: turn-tcp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flow.fullname" . }}-coturn{{ $pool.suffix }}-metrics
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
    flow.heterocloud.io/turn-pool: {{ $pool.name }}
spec:
  type: ClusterIP
  selector:
    {{- include "flow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
    flow.heterocloud.io/turn-pool: {{ $pool.name }}
  ports:
    - name: metrics
      port: {{ $pool.metricsPort }}
      targetPort: metrics
      protocol: TCP
      appProtocol: http
{{- end }}
{{- end }}
