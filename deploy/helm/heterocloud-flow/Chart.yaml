apiVersion: v2
name: heterocloud-flow
description: HA managed realtime control and data plane for HeteroCloud
type: application
version: 0.1.28
appVersion: "0.1.16"
kubeVersion: ">=1.29.0-0"
home: https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flow
sources:
  - https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flow
dependencies:
  - name: redis
    version: 23.1.1
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: postgresql-ha
    version: 16.3.2
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql-ha.enabled
