fullnameOverride: heterocloud-flow

image:
  repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flow
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

runtime:
  hostNetwork: false

secrets:
  existingSecret: heterocloud-flow-secrets
  create: false
  values:
    databaseUrl: ""
    heterocloudProviderPublicKeysJson: ""
    flowPrincipalContextHmacSecret: ""
    livekitApiKey: ""
    livekitApiSecret: ""
    turnSharedSecret: ""

providerAuth:
  issuer: heterocloud
  audience: heterocloud-flow
  publicKeysSecretKey: heterocloud-provider-public-keys.json

principalAuth:
  issuer: heterocloud
  audience: heterocloud-flow-data
  maxTokenTtlSeconds: 300
  contextSecretKey: flow-principal-context-hmac-secret

rateLimit:
  # Deployment-level ceiling. Normal client limits are configured per Flow
  # service in HeteroCloud and must remain at or below this boundary.
  requestsPerSecond: 1000
  burst: 5000
  trustedProxyCidrs:
    - 127.0.0.0/8
    - ::1/128

database:
  externalPort: 5432
  proxy:
    enabled: false
    port: 5432
    addresses: []
    endpointNodeNames: {}
  # Select nodes where a node-local database endpoint is available. This is
  # merged with the global nodeSelector for every database client workload.
  nodeSelector: {}
  maxConnections:
    api: 20
    matchmaker: 10
    signaling: 20
  migrateOnApiStart: false
  migrationJob:
    enabled: true

api:
  replicaCount: 3
  publicUrls:
    - https://flow-a.example.com
    - https://flow-b.example.com
    - https://flow-c.example.com
  publicService:
    enabled: false
    port: 8080
    annotations: {}
    loadBalancerSourceRanges: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

matchmaker:
  replicaCount: 3
  pollIntervalMs: 250
  reservationTtlSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

signaling:
  replicaCount: 3
  publicUrls:
    - wss://flow-a.example.com
    - wss://flow-b.example.com
    - wss://flow-c.example.com
  authTimeoutSeconds: 5
  service:
    port: 8082
    targetPort: 8082
  publicService:
    enabled: false
    port: 8082
    annotations: {}
    loadBalancerSourceRanges: []
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

livekit:
  replicaCount: 3
  image:
    repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flow-livekit
    tag: "0.1.17"
    pullPolicy: IfNotPresent
  internalUrl: http://heterocloud-flow-livekit:7880
  publicUrls:
    - wss://rtc-a.example.com
    - wss://rtc-b.example.com
    - wss://rtc-c.example.com
  existingConfigSecret: ""
  metrics:
    port: 6789
    urls: []
  signal:
    servicePort: 7880
    publicService:
      enabled: false
      port: 7880
      annotations: {}
      loadBalancerSourceRanges: []
  rtc:
    tcpPort: 7881
    udpPort: 7882
    annotations: {}
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi

coturn:
  replicaCount: 3
  additionalPools: []
  image:
    repository: coturn/coturn
    tag: 4.16.0
    pullPolicy: IfNotPresent
  realm: turn.flow.example.com
  publicHosts:
    - turn-a.example.com
    - turn-b.example.com
    - turn-c.example.com
  relayAddress:
    # host: let coturn select a local relay address without mappings.
    # direct-public: bind the mapped publicIp that is local to the host.
    # one-to-one-nat: bind privateIp and advertise publicIp/privateIp.
    mode: host
    mappings: []
  servicePort: 3478
  relayPortMin: 49160
  relayPortMax: 49260
  credentialTtlSeconds: 300
  performance:
    socketBufferBytes: 4194304
    tuneHostUdpBuffers: true
    hostReceiveBufferMaxBytes: 16777216
    hostSendBufferMaxBytes: 16777216
    hostNetdevMaxBacklog: 65536
  metrics:
    port: 9641
    urls: []
  annotations: {}
  nodeSelector: {}
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      # TURN is a bandwidth-bound data plane. A fixed CPU limit throttles large
      # relay nodes to the capacity of the smallest worker, so let the kernel
      # scheduler use the CPU available on each host.
      memory: 1Gi

redis:
  enabled: true
  fullnameOverride: heterocloud-flow-redis
  architecture: replication
  auth:
    enabled: false
  sentinel:
    enabled: true
    masterSet: flowmaster
    quorum: 2
  master:
    persistence:
      enabled: true
      size: 8Gi
    pdb:
      create: true
      minAvailable: 1
  replica:
    # In Bitnami Sentinel mode this is the total Redis/Sentinel pod count.
    replicaCount: 3
    podAntiAffinityPreset: hard
    persistence:
      enabled: true
      size: 8Gi
    pdb:
      create: true
      minAvailable: 2

externalRedis:
  address: ""
  sentinelUrls: []
  sentinelMaster: flowmaster
  passwordSecretKey: ""
  sentinelPasswordSecretKey: ""

monitoring:
  prometheus:
    enabled: false
    replicaCount: 1
    image:
      repository: prom/prometheus
      tag: v3.13.2-distroless
      digest: sha256:64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e
      pullPolicy: IfNotPresent
    # The busybox Prometheus variant is used only to initialize hostPath
    # ownership. The server itself always runs from the distroless image.
    initImage:
      repository: prom/prometheus
      tag: v3.13.2
      digest: sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
      pullPolicy: IfNotPresent
    scrapeInterval: 15s
    evaluationInterval: 15s
    retentionTime: 15d
    retentionSize: 10GB
    externalLabels:
      cluster: heterocloud-flow
    additionalScrapeNamespaces: []
    service:
      port: 9090
      type: ClusterIP
      loadBalancerClass: ""
      ingressReplicas: 1
      loadBalancerSourceRanges: []
    vpnAccess:
      enabled: false
      sourceCidrs: []
    heteronetwork:
      enabled: false
      agentMetricsPort: 9781
      interface: heteronetwork0
    storage:
      type: emptyDir
      emptyDir:
        sizeLimit: 10Gi
      hostPath: ""
    nodeSelector: {}
    tolerations: []
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
  grafana:
    enabled: false
    replicaCount: 1
    listenPort: 3000
    image:
      repository: grafana/grafana
      tag: 13.1.0
      digest: sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
      pullPolicy: IfNotPresent
    prometheusUrl: http://heterocloud-flow-prometheus:9090
    existingSecret: heterocloud-flow-grafana
    secretKeys:
      databaseUrl: database-url
      adminUser: admin-user
      adminPassword: admin-password
      secretKey: secret-key
    anonymousViewerEnabled: false
    service:
      port: 3000
      type: ClusterIP
      loadBalancerClass: ""
      ingressReplicas: 1
      loadBalancerSourceRanges: []
    vpnAccess:
      enabled: false
      sourceCidrs: []
    nodeSelector: {}
    tolerations: []
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

postgresql-ha:
  enabled: false
  fullnameOverride: heterocloud-flow-postgresql
  postgresql:
    replicaCount: 3
    syncReplication: true
    syncReplicationMode: ANY
    pdb:
      create: true
      minAvailable: 2
    persistence:
      enabled: true
      size: 20Gi
  pgpool:
    replicaCount: 2
    pdb:
      create: true
      minAvailable: 1

networkPolicy:
  enabled: true
  externalEgressCidrs:
    - 0.0.0.0/0
    - ::/0

podAnnotations: {}
nodeSelector: {}
tolerations: []
priorityClassName: ""
