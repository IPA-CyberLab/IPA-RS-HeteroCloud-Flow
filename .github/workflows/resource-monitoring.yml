name: Resource monitoring
on:
  push:
    branches: [master]
    paths:
      - 'monitoring/**'
      - 'deploy/helm/heterocloud-flow/**'
      - 'deploy/environments/heteronet/values.yaml'
      - '.github/workflows/resource-monitoring.yml'
  pull_request:
    paths:
      - 'monitoring/**'
      - 'deploy/helm/heterocloud-flow/**'
      - 'deploy/environments/heteronet/values.yaml'
      - '.github/workflows/resource-monitoring.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s monitoring/resource-exporter -v
      - run: pip install --require-hashes -r monitoring/resource-exporter/requirements.txt
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - run: pip install PyYAML==6.0.3
      - run: python -m unittest discover -s monitoring -v
      - name: Verify capacity denominators and dedicated-master exclusion
        run: |
          python monitoring/capacity_promql_cases.py | docker run --rm -i \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.13.2-distroless@sha256:64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e \
            test rules /dev/stdin
      - run: bash deploy/helm/heterocloud-flow/scripts/test-grafana-template.sh
      - run: bash deploy/helm/heterocloud-flow/scripts/test-prometheus-template.sh

  image:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: monitoring/resource-exporter/Dockerfile
          push: true
          tags: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flow-resource-exporter:${{ github.sha }}
          provenance: false
