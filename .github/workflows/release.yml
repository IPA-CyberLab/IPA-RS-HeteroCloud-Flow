name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow-test-password
          POSTGRES_DB: flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://flow:flow-test-password@127.0.0.1:5432/flow
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Build chart dependencies
        run: helm dependency build deploy/helm/heterocloud-flow
      - name: Lint chart
        run: helm lint deploy/helm/heterocloud-flow -f deploy/helm/heterocloud-flow/ci/test-values.yaml
      - name: Test coturn external IP mappings
        run: bash deploy/helm/heterocloud-flow/scripts/test-coturn-template.sh
      - name: Test fixed Flow traffic policy
        run: bash deploy/helm/heterocloud-flow/scripts/test-traffic-policy-template.sh
      - name: Validate Prometheus configuration
        run: bash deploy/helm/heterocloud-flow/scripts/test-prometheus-template.sh
      - name: Validate Grafana configuration
        run: bash deploy/helm/heterocloud-flow/scripts/test-grafana-template.sh
      - name: Render chart
        run: >-
          helm template flow deploy/helm/heterocloud-flow
          -f deploy/helm/heterocloud-flow/ci/test-values.yaml
          > /tmp/heterocloud-flow.yaml
      - name: Validate Kubernetes manifests
        run: >-
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary -kubernetes-version 1.31.0
          < /tmp/heterocloud-flow.yaml
      - name: Package chart
        run: |
          mkdir -p dist
          helm package deploy/helm/heterocloud-flow --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: flow-meta
        with:
          images: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flow
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.flow-meta.outputs.tags }}
          labels: ${{ steps.flow-meta.outputs.labels }}
          cache-from: type=gha,scope=flow
          cache-to: type=gha,mode=max,scope=flow
      - uses: docker/metadata-action@v5
        id: livekit-meta
        with:
          images: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flow-livekit
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.livekit
          push: true
          tags: ${{ steps.livekit-meta.outputs.tags }}
          labels: ${{ steps.livekit-meta.outputs.labels }}
          cache-from: type=gha,scope=livekit
          cache-to: type=gha,mode=max,scope=livekit
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
