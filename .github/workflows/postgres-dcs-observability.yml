name: PostgreSQL DCS observability
on:
  push:
    branches: [master, codex/postgres-dcs-alerts]
    paths:
      - 'deploy/helm/heterocloud-flow/**'
      - 'deploy/environments/heteronet/values.yaml'
      - 'monitoring/postgres_dcs_alert_cases.py'
      - '.github/workflows/postgres-dcs-observability.yml'
  pull_request:
    paths:
      - 'deploy/helm/heterocloud-flow/**'
      - 'deploy/environments/heteronet/values.yaml'
      - 'monitoring/postgres_dcs_alert_cases.py'
      - '.github/workflows/postgres-dcs-observability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - run: python -m pip install PyYAML==6.0.3
      - run: bash deploy/helm/heterocloud-flow/scripts/test-prometheus-template.sh
      - name: Evaluate health and fail-closed alert expressions
        run: |
          python monitoring/postgres_dcs_alert_cases.py | docker run --rm -i \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.13.2-distroless@sha256:64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e \
            test rules /dev/stdin
